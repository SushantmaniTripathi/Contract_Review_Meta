name: contract-review-env
version: "1.0.0"
description: >
  An RL environment where AI agents act as legal contract reviewers.
  Agents identify missing clauses, ambiguous language, and cross-document
  contradictions across three difficulty levels with partial-credit rewards.
author: Sushantmani Tripathi
license: MIT
tags:
  - legal
  - contract-review
  - nlp
  - real-world
  - compliance

tasks:
  - id: easy
    name: Missing Clause Detection
    description: Identify missing standard clauses in a vendor service agreement
    difficulty: easy
    max_steps: 3
    success_threshold: 0.6

  - id: medium
    name: Ambiguous Language Detection
    description: Detect vague, risky, and likely unenforceable clauses in a consulting contract
    difficulty: medium
    max_steps: 3
    success_threshold: 0.6

  - id: hard
    name: Cross-Document Contradiction Detection
    description: Find payment term conflicts between a Master Service Agreement and Statement of Work
    difficulty: hard
    max_steps: 3
    success_threshold: 0.5

server:
  port: 7860
  health_endpoint: /health
  reset_endpoint: /reset
  step_endpoint: /step
  state_endpoint: /state
